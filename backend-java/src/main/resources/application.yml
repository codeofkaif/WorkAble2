server:
  port: ${PORT:5001}

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ai_job_accessibility}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ai-job-accessibility}
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

app:
  jwt:
    secret: ${JWT_SECRET:your_jwt_secret_key_change_in_production}
  gemini:
    api-key: ${GEMINI_API_KEY:}
  context-engine:
    url: ${CONTEXT_ENGINE_URL:http://127.0.0.1:8000}
    api-key: ${CONTEXT_ENGINE_API_KEY:test-api-key}
    knowledge-base-id: ${KNOWLEDGE_BASE_ID:kb-workable-001}
  env: ${SPRING_PROFILES_ACTIVE:development}
  # DB-First Job Aggregation, Synchronization, and Freshness Policy
  jobs:
    freshness-hours: ${JOB_FRESHNESS_HOURS:6}
    min-recommendation-jobs: ${MIN_RECOMMENDATION_JOBS:20}
    sync-interval-hours: ${JOB_SYNC_INTERVAL_HOURS:6}
    sync-interval-ms: ${JOB_SYNC_INTERVAL_MS:21600000} # 6 hours
    sync-initial-delay-ms: ${JOB_SYNC_INITIAL_DELAY_MS:60000} # 1 min after startup
    sync-enabled: ${JOB_SYNC_ENABLED:true}
    jooble:
      api-key: ${JOOBLE_API_KEY:}
    adzuna:
      app-id: ${ADZUNA_APP_ID:}
      api-key: ${ADZUNA_API_KEY:}
      country: ${ADZUNA_COUNTRY:us}
    jsearch:
      api-key: ${JSEARCH_API_KEY:}
      host: ${JSEARCH_HOST:jsearch.p.rapidapi.com}

logging:
  level:
    com.ai.accessibility: DEBUG
    org.springframework.web: INFO
